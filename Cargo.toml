[package]
name = "sdr-aaronia-rs"
description = "Unified Rust interface for Aaronia Spectran Spectrum Analyzers / SDRs, featuring Python bindings, a SoapySDR plugin, HTTP streaming, and native SDK support."
license = "GPL-3.0-or-later"
version = "0.15.0"
edition = "2024"
rust-version = "1.100"
repository = "https://github.com/isaacbentley/sdr-aaronia-rs"
readme = "README.md"
keywords = ["sdr", "aaronia", "spectran", "rf", "iq"]
categories = ["hardware-support", "api-bindings", "science"]
exclude = ["tests/*.rtsa", "tests/sdk/", "tests/asan/", ".github/"]

[package.metadata.docs.rs]
features = ["http", "file", "ffi", "tls", "native-sdk"]
rustdoc-args = ["--cfg", "docsrs"]

# No `crate-type`: the library is an rlib, which is all a Rust dependent
# links. Declaring `cdylib` and `staticlib` here made every build of this
# crate, as a dependency too, also link a shared library and write a static
# library holding every dependency and std (300 MB in a debug build), which
# no Rust dependent uses. The C library is built on request instead:
#   cargo rustc --release --lib --crate-type staticlib --crate-type cdylib
# (soapy-aaronia/CMakeLists.txt and tests/asan/run_asan.sh do; PLUGINS.md).

[dependencies]
# `deflate`/`gzip`: the RTSA control plane compresses when asked and we
# were not asking — /remoteconfig is 17,432 bytes plain against 3,299
# deflated, /healthstatus 6,100 against 1,436, and both are fetched on
# every device open. RTSA-Suite's own HTTP Client sends
# `Accept-Encoding: deflate`. Costs nothing on /stream, which the server
# does not compress at any level.
#
# `default-features = false`: reqwest's defaults are TLS, HTTP/2, charset
# decoding and system proxy detection. TLS and HTTP/2 are this crate's
# `tls` feature (a default one). The other two were dead weight: every
# client is built with `.no_proxy()`, and RTSA's bodies are read as bytes
# or JSON, never through a charset. `blocking` was never used.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "deflate", "gzip"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
bytes = { version = "1.12", optional = true }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
tracing = "0.1"
url = { version = "2.5", optional = true }
# No `audio`: no block in this crate plays or records sound, and that
# feature brings cpal, rodio and symphonia with every codec (31 to 39
# crates, by platform) to whoever enables `futuresdr`. The one user is examples/noaa_scanner.rs,
# through the `futuresdr-audio` feature.
futuresdr = { version = "0.10", default-features = false, optional = true }
futures = { version = "0.3", optional = true }
byteorder = { version = "1.5", optional = true }
bitflags = { version = "2.13", optional = true }
half = { version = "2.7", optional = true }

num-complex = "0.4"
tempfile = { version = "3.27", optional = true }
anyhow = { version = "1.0", optional = true }
# default-features = false: seify's defaults include its own driver
# backends (soapy -> soapysdr-sys, which needs system SoapySDR +
# libclang at build time and is BSL-1.0-licensed). We only need the
# core traits for our backend impl.
seify = { version = "0.26", optional = true, default-features = false }

[dev-dependencies]
anyhow = "1.0"
tracing-subscriber = "0.3"  # For examples
# NOTE: deliberately no `soapysdr` dev-dependency: soapysdr-sys needs
# the system SoapySDR library + libclang at *build* time, which would
# break `cargo test` on every machine/CI leg without them. The Soapy
# plugin is covered by ci.yml's dedicated `soapy` job (cmake build +
# SoapySDRUtil load check) and by live testing through SoapySDRUtil.

proptest = "1.12"
criterion = { version = "0.8", features = ["html_reports"] }
wiremock = "0.6" # For HTTP endpoint resiliency testing

# The native-SDK live suite uses `#[tokio::test]`, and must build in a
# `--no-default-features --features native-sdk` configuration where the
# `http` feature is not pulling `dep:tokio` in.
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Each `[[bench]]` declares one criterion harness binary. Run with
# `cargo bench --bench <name>`. Coverage:
#   parse_int16_packet    — HTTP int16 packet parse throughput
#   decompress_block      — Rice + wavelet decode throughput
#   rtsa_open_and_read    — RTSA file open + sample read (LFS fixture)
#   deinterleave_dual_iq  — dual-channel IQ demux (native-SDK hot path)
[[bench]]
name = "parse_int16_packet"
harness = false
required-features = ["http"]

[[bench]]
name = "deinterleave_dual_iq"
harness = false

[[bench]]
name = "decompress_block"
harness = false
required-features = ["file"]

[[bench]]
name = "rtsa_open_and_read"
harness = false
required-features = ["file"]

# Feature guards for integration tests so `cargo check/test --all-targets`
# succeeds under every isolated `--no-default-features --features <feat>`
# permutation.
[[test]]
name = "c_api_test"
required-features = ["ffi"]

[[test]]
name = "http_mock_test"
required-features = ["http"]

[[test]]
name = "http_resilience_test"
required-features = ["http", "file"]

[[test]]
name = "http_sink_test"
required-features = ["futuresdr"]

[[test]]
name = "integration_test"
required-features = ["http", "file"]

[[test]]
name = "live_smoke"
required-features = ["http", "file"]

[[test]]
name = "native_sdk_live"
required-features = ["native-sdk", "http", "file", "ffi"]

[[test]]
name = "properties"
required-features = ["http", "file"]

[[test]]
name = "rtsa_negative_test"
required-features = ["file"]

[[test]]
name = "test_cw_mag"
required-features = ["file"]

[[test]]
name = "test_cw_meta"
required-features = ["file"]

[[test]]
name = "wire_contract"
required-features = ["http"]

[features]
default    = ["http", "file", "ffi", "tls"]
http       = ["dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json",
              "dep:url", "dep:bytes", "dep:futures", "dep:half"]
file       = ["dep:byteorder", "dep:bitflags", "dep:tempfile"]
# `https://` base URLs (an RTSA server behind a TLS-terminating proxy), and
# HTTP/2 when that proxy's ALPN offers it: rustls with aws-lc, about 3 MB
# of a linked binary. RTSA itself serves plain `http://`, so a build that
# only reaches it directly can leave this out
# (`default-features = false, features = ["http", "file"]`); an `https://`
# URL is then refused when the client is built.
tls        = ["http", "reqwest/rustls", "reqwest/http2"]
futuresdr  = ["http", "dep:futuresdr", "dep:anyhow"]
# FutureSDR's audio blocks, for examples/noaa_scanner.rs only.
futuresdr-audio = ["futuresdr", "futuresdr/audio"]
seify      = ["http", "file", "dep:seify"]
ffi        = ["http", "file"]
native-sdk = ["dep:libloading", "dep:widestring"]

[[example]]
name = "noaa_scanner"
required-features = ["futuresdr-audio", "http", "file"]

[[example]]
name = "native_sdk_basic"
required-features = ["native-sdk"]

[[example]]
name = "native_sdk_transmit"
required-features = ["native-sdk"]

[[example]]
name = "dump_metadata"
required-features = ["file"]

[[example]]
name = "device_control"
required-features = ["http"]

[[example]]
name = "http_iq_quickstart"
required-features = ["http", "file"]

[[example]]
name = "read_rtsa_file"
required-features = ["http", "file"]


[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
libloading = { version = "0.9", optional = true }
widestring = { version = "1.2", optional = true }

[workspace]
members = ["python-aaronia"]

[[example]]
name = "native_sdk_qualification"
required-features = ["native-sdk", "http", "file"]
