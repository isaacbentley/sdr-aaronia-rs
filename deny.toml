# cargo-deny configuration. CI runs `cargo deny check` (advisories,
# licenses, bans, sources) — see `.github/workflows/ci.yml`'s `deny` job.

[advisories]
version = 2
yanked = "deny"
# No advisories are currently ignored. The Phase-1 dependency diet
# removed `async-std` (previously pulled in transitively via
# `futuresdr`) from the tree entirely, so the `RUSTSEC-2025-0052` ignore
# that used to live here no longer matches anything — `cargo deny`
# already flags a stale ignore as a hard error, which is what caught
# this.

[licenses]
version = 2
# The crate itself is GPL-3.0-or-later.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "MPL-2.0",
    "CC0-1.0",
]

[sources]
# `sdr-source-rs` is consumed as a pinned git dependency until it is
# published to crates.io.
unknown-git = "allow"
