# cargo-deny configuration. CI runs `cargo deny check` (advisories,
# licenses, bans, sources) — see `.github/workflows/ci.yml`'s `deny` job.

[advisories]
version = 2
yanked = "deny"
# No advisories are currently ignored. The Phase-1 dependency diet
# removed `async-std` (previously pulled in transitively via
# `futuresdr`) from the tree entirely, so the `RUSTSEC-2025-0052` ignore
# that used to live here no longer matches anything — `cargo deny`
# already flags a stale ignore as a hard error, which is what caught
# this.

[licenses]
version = 2
# The crate itself is GPL-3.0-or-later.
# No stale entries: `cargo deny check` warns on an allowance no crate in
# the lockfile uses ("Zlib" and "MPL-2.0" allowances used to sit here
# after their last users left the tree).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
skip = [
    # system-configuration 0.7 (hyper-util → reqwest) still pins
    # core-foundation 0.9 while rustls-platform-verifier /
    # security-framework moved to 0.10. Converges once hyper-util's
    # system-configuration dependency catches up; drop this skip then.
    { crate = "core-foundation@0.9", reason = "transitive pin via system-configuration 0.7" },
]

[sources]
# `sdr_source` re-exports the published `orecchiette-sdr-source-rs`
# crates.io crate (formerly a vendored copy, then a git dependency),
# so no git sources remain.
unknown-git = "deny"
