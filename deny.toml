# cargo-deny configuration. CI runs `cargo deny --all-features check`
# (advisories, licenses, bans, sources; the action's default arguments
# include --all-features) — see `.github/workflows/ci.yml`'s `deny` job.

[advisories]
version = 2
yanked = "deny"
# No advisories are currently ignored. The Phase-1 dependency diet
# removed `async-std` (previously pulled in transitively via
# `futuresdr`) from the tree entirely, so the `RUSTSEC-2025-0052` ignore
# that used to live here no longer matches anything — `cargo deny`
# already flags a stale ignore as a hard error, which is what caught
# this.

[licenses]
version = 2
# The crate itself is GPL-3.0-or-later.
# CI runs the deny action with its default `--all-features` arguments,
# so allowances must be validated against the *all-features* graph:
# `cargo deny --all-features check`. A plain `cargo deny check` reports
# "Zlib" and "MPL-2.0" as unmatched because their users are
# feature-gated (foldhash pulls Zlib; option-ext and the symphonia
# family pull MPL-2.0) — that is not staleness, do not remove them.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "CC0-1.0",
    "MPL-2.0",
    "Zlib",
]

[sources]
# `sdr_source` re-exports the published `orecchiette-sdr-source-rs`
# crates.io crate (formerly a vendored copy, then a git dependency),
# so no git sources remain.
unknown-git = "deny"
