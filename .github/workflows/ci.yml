name: CI

# Five-job pipeline for the standalone aaronia-rs crate. Designed to
# move cleanly when the crate is extracted from the orecchiette
# monorepo: this workflow stays alongside `Cargo.toml`, so a
# `git subtree split` or directory copy carries it intact.
#
# Job overview:
#   test     — cargo fmt/clippy + test + coverage on Linux/macOS/Windows x stable
#   miri     — cargo miri test on the FFI-free modules (Linux nightly)
#   deny     — cargo-deny advisories check (RUSTSEC vulnerabilities)
#   hack     — cargo hack check --each-feature (per-feature build isolation)
#   machete  — cargo machete (unused dependency check)
#
# `cargo semver-checks` runs at release time (see release.yml), not here:
# with `continue-on-error: true` it could never gate a merge, so running it
# on every push/PR only cost CI minutes without catching anything early.
#
# `workflow_dispatch` is enabled so the user can manually rebuild any
# job without pushing.

# Least-privilege token: no job in this workflow writes to the
# repository (flagged by CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Property tests run 256 cases by default. Bump in nightly/manual runs
  # via `gh workflow run ci.yml -f proptest_cases=4096` once dispatch
  # inputs are wired up. For now the default is fine for PRs.
  PROPTEST_CASES: "256"

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The 4.4 MB / 183 MB RTSA fixtures live in LFS. The test
          # suite skips them gracefully via `rtsa_fixture_missing`,
          # so CI doesn't need to fetch them on every run.
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --all-features

      - name: cargo test + coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false  # coverage drop != broken build


  miri:
    name: Miri (decompression + http_streaming + utils)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      # Pinned: current nightlies changed the unstable `fadd_fast`
      # intrinsic signature (new `FloatPrimitive` bound), which breaks the
      # `futuredsp` dependency's compile and kept this job permanently
      # red. This nightly is verified locally to build the dep tree and
      # pass all three allowlisted module suites under Miri. Bump
      # deliberately once futuredsp releases a fix.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          components: miri

      - uses: Swatinem/rust-cache@v2

      # Allowlist of modules that don't touch FFI / mmap / syscalls.
      # Miri refuses to interpret FFI calls, so the native_sdk / file_source
      # paths are intentionally excluded.
      - name: cargo miri test (allowlisted modules)
        run: |
          cargo miri test --lib decompression
          cargo miri test --lib http_streaming
          cargo miri test --lib utils

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      # Runs all cargo-deny checks (advisories, licenses, bans, sources)
      # based on deny.toml configuration.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  hack:
    name: cargo-hack (feature permutations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: cargo hack
        run: cargo hack check --each-feature --no-dev-deps

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: cargo machete
        run: cargo machete
