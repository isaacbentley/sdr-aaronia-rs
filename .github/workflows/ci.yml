name: CI

# CI pipeline for the standalone aaronia-rs crate. Designed to
# move cleanly when the crate is extracted from the orecchiette
# monorepo: this workflow stays alongside `Cargo.toml`, so a
# `git subtree split` or directory copy carries it intact.
#
# Job overview:
#   test     — cargo fmt/clippy + test + coverage on Linux/macOS/Windows x stable,
#              every feature except `futuresdr`
#   nightly  — clippy + test --all-features (`futuresdr` included) on
#              Linux/Windows x the pinned nightly
#   miri     — cargo miri test on the FFI-free modules (Linux nightly)
#   deny     — cargo-deny advisories check (RUSTSEC vulnerabilities)
#   hack     — cargo hack check --each-feature (per-feature build isolation),
#              `futuresdr` excluded
#   machete  — cargo machete (unused dependency check)
#   python   — maturin build + pytest of the Python bindings
#   soapy    — SoapySDR plugin cmake build + load check (Linux/macOS)
#
# Stable/nightly split: FutureSDR 0.10 enables unstable language
# features, so anything that compiles the `futuresdr` feature fails on
# stable with E0554. The stable jobs name every other feature
# (`STABLE_FEATURES` below) instead of passing `--all-features`, so the
# configurations downstream users build on stable (http + file +
# native-sdk) stay covered on stable, and the `nightly` job covers
# `futuresdr`. A new Cargo feature goes into `STABLE_FEATURES` (and the
# copies in scripts/ci-local.sh and release.yml's semver-checks step)
# unless it needs nightly too.
#
# `cargo semver-checks` runs at release time (see release.yml), not here:
# with `continue-on-error: true` it could never gate a merge, so running it
# on every push/PR only cost CI minutes without catching anything early.
#
# `workflow_dispatch` is enabled so the user can manually rebuild any
# job without pushing.
#
# Local mirror: `scripts/ci-local.sh` reproduces each job's exact
# command for pre-push verification — keep the two in sync. Note the
# deny action's default arguments include `--all-features`.

# Least-privilege token: no job in this workflow writes to the
# repository (flagged by CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Property tests run 256 cases by default. Bump in nightly/manual runs
  # via `gh workflow run ci.yml -f proptest_cases=4096` once dispatch
  # inputs are wired up. For now the default is fine for PRs.
  PROPTEST_CASES: "256"
  # Every Cargo feature except `futuresdr`, which needs nightly (see the
  # header). Steps expand it as `${{ env.STABLE_FEATURES }}`, not
  # `$STABLE_FEATURES`, so it reads the same in the Windows legs' pwsh.
  STABLE_FEATURES: "http,file,ffi,seify,native-sdk"

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A full build + test leg normally finishes in ~3 minutes; the cap
    # exists because a single hung test otherwise occupies a runner for
    # the 6-hour GitHub default (observed: http_sink_test wedged a
    # windows runner for ~2h before being cancelled by hand).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          # The 4.4 MB / 183 MB RTSA fixtures live in LFS. The test
          # suite skips them gracefully via `rtsa_fixture_missing`,
          # so CI doesn't need to fetch them on every run.
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        # --workspace: python-aaronia is a workspace member that no other
        # job lints (the python job only builds/tests it). clippy compiles
        # without linking, so the pyo3 cdylib is safe to include here.
        # Not --all-features: `futuresdr` needs nightly (the `nightly` job).
        run: cargo clippy --workspace --features ${{ env.STABLE_FEATURES }} --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --features ${{ env.STABLE_FEATURES }}

      - name: cargo test + coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --features ${{ env.STABLE_FEATURES }} --lcov --output-path lcov.info

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false  # coverage drop != broken build

  # The `futuresdr` half of the stable/nightly split (see the header):
  # FutureSDR 0.10 builds only on nightly, so this is the one job that
  # compiles `--all-features`. Linux and Windows because `SdkSinkBlock`
  # (futuresdr + native-sdk) exists only there; macOS is left out because
  # the rest of the futuresdr code is platform-independent and the Linux
  # leg already builds it.
  nightly:
    name: Nightly all-features (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Longer cap than `test`: this leg compiles the workspace twice
    # (clippy, then test) on an uncached toolchain, Windows included.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      # Pinned, not `nightly`: a moving nightly breaks the build whenever
      # an unstable feature FutureSDR uses changes shape (as `fadd_fast`
      # did for the Miri job's pin). This is the nightly the FutureSDR
      # 0.10 port was verified on; bump it deliberately, together with
      # NIGHTLY_TOOLCHAIN in scripts/ci-local.sh and CONTRIBUTING.md.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-21
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo clippy --all-features
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: cargo test --all-features
        run: cargo test --all-features

      # The stable `hack` job excludes `futuresdr`; this is the remainder,
      # `futuresdr` on its own (--no-default-features --features futuresdr).
      - name: Install cargo-hack
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-hack

      - name: cargo hack (futuresdr alone)
        if: runner.os == 'Linux'
        run: |
          cargo hack check --each-feature --no-dev-deps --include-features futuresdr
          cargo hack check --each-feature --all-targets --include-features futuresdr

  miri:
    name: Miri (decompression + http_streaming + utils)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      # Pinned: current nightlies changed the unstable `fadd_fast`
      # intrinsic signature (new `FloatPrimitive` bound), which breaks the
      # `futuredsp` dependency's compile and kept this job permanently
      # red. This nightly is verified locally to build the dep tree and
      # pass all three allowlisted module suites under Miri. Bump
      # deliberately once futuredsp releases a fix.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          components: miri

      - uses: Swatinem/rust-cache@v2

      # Allowlist of modules that don't touch FFI / mmap / syscalls.
      # Miri refuses to interpret FFI calls, so the native_sdk / file_source
      # paths are intentionally excluded.
      # --ignore-rust-version: the pinned nightly is 1.94, older than the
      # crate's `rust-version` (1.100), which cargo would otherwise refuse.
      - name: cargo miri test (allowlisted modules)
        run: |
          cargo miri test --ignore-rust-version --lib decompression
          cargo miri test --ignore-rust-version --lib http_streaming
          cargo miri test --ignore-rust-version --lib utils

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      # Runs all cargo-deny checks (advisories, licenses, bans, sources)
      # based on deny.toml configuration.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  hack:
    name: cargo-hack (feature permutations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      # --exclude-features futuresdr: it needs nightly, so the `nightly`
      # job checks it on its own. Excluding it also drops cargo-hack's
      # --all-features run, which the `nightly` job's clippy covers.
      - name: cargo hack
        run: |
          cargo hack check --each-feature --no-dev-deps --exclude-features futuresdr
          cargo hack check --each-feature --all-targets --exclude-features futuresdr

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: cargo machete
        run: cargo machete

  # The Python bindings and the SoapySDR C++ plugin previously compiled
  # for the first time in release.yml — at tag time. These jobs make
  # them PR-gated. Mirrored in scripts/ci-local.sh (python/soapy steps).
  python:
    name: Python bindings (maturin build + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and install wheel
        run: |
          python -m pip install maturin pytest numpy pyarrow
          maturin build --release --manifest-path python-aaronia/Cargo.toml --out dist
          python -m pip install dist/*.whl

      - name: pytest
        run: python -m pytest python-aaronia/test_basic.py -q

  soapy:
    # macOS as well as Linux: the two toolchains link a dlopen'd module
    # differently, and a macOS-only link defect shipped through several
    # releases because nothing built the plugin on a Mac before the
    # release job did.
    name: SoapySDR plugin (cmake build + load check)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - name: Install SoapySDR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsoapysdr-dev soapysdr-tools

      - name: Install SoapySDR (macOS)
        if: runner.os == 'macOS'
        run: brew install soapysdr

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # Hygiene, not the fix: the module's link line no longer asks for
      # a flat namespace, so the dangling-bind defect that broke every
      # published macOS module cannot recur. Older linkers hit it and
      # newer ones did not, so build with the newest Xcode the image
      # ships rather than whatever xcode-select happens to point at.
      - name: Select newest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          newest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          ld -v 2>&1 | head -2 || true

      - name: Build plugin (drives cargo internally)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            native_sdk=ON
          else
            native_sdk=OFF
          fi
          cmake -S soapy-aaronia -B soapy-aaronia/build -DCMAKE_BUILD_TYPE=Release \
            -DAARONIA_NATIVE_SDK="$native_sdk" \
            -DCMAKE_VERBOSE_MAKEFILE=ON
          cmake --build soapy-aaronia/build

      # --check reports a missing driver on stdout; check the text, not
      # just the exit status.
      - name: Module load check
        run: |
          SOAPY_SDR_PLUGIN_PATH=$PWD/soapy-aaronia/build \
            SoapySDRUtil --check=aaronia | tee check.log
          grep -q "PRESENT" check.log
