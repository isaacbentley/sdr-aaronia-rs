name: CI

# Five-job pipeline for the standalone aaronia-rs crate. Designed to
# move cleanly when the crate is extracted from the orecchiette
# monorepo: this workflow stays alongside `Cargo.toml`, so a
# `git subtree split` or directory copy carries it intact.
#
# Job overview:
#   test     — cargo fmt/clippy + test + coverage on Linux/macOS/Windows x stable
#   miri     — cargo miri test on the FFI-free modules (Linux nightly)
#   deny     — cargo-deny advisories check (RUSTSEC vulnerabilities)
#   hack     — cargo hack check --each-feature (per-feature build isolation)
#   machete  — cargo machete (unused dependency check)
#
# `cargo semver-checks` runs at release time (see release.yml), not here:
# with `continue-on-error: true` it could never gate a merge, so running it
# on every push/PR only cost CI minutes without catching anything early.
#
# `workflow_dispatch` is enabled so the user can manually rebuild any
# job without pushing.
#
# Local mirror: `scripts/ci-local.sh` reproduces each job's exact
# command for pre-push verification — keep the two in sync. Note the
# deny action's default arguments include `--all-features`.

# Least-privilege token: no job in this workflow writes to the
# repository (flagged by CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Property tests run 256 cases by default. Bump in nightly/manual runs
  # via `gh workflow run ci.yml -f proptest_cases=4096` once dispatch
  # inputs are wired up. For now the default is fine for PRs.
  PROPTEST_CASES: "256"

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A full build + test leg normally finishes in ~3 minutes; the cap
    # exists because a single hung test otherwise occupies a runner for
    # the 6-hour GitHub default (observed: http_sink_test wedged a
    # windows runner for ~2h before being cancelled by hand).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          # The 4.4 MB / 183 MB RTSA fixtures live in LFS. The test
          # suite skips them gracefully via `rtsa_fixture_missing`,
          # so CI doesn't need to fetch them on every run.
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: cargo clippy
        if: matrix.os == 'ubuntu-latest'
        # --workspace: python-aaronia is a workspace member that no other
        # job lints (the python job only builds/tests it). clippy compiles
        # without linking, so the pyo3 cdylib is safe to include here.
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo test (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --all-features

      - name: cargo test + coverage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false  # coverage drop != broken build


  miri:
    name: Miri (decompression + http_streaming + utils)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      # Pinned: current nightlies changed the unstable `fadd_fast`
      # intrinsic signature (new `FloatPrimitive` bound), which breaks the
      # `futuredsp` dependency's compile and kept this job permanently
      # red. This nightly is verified locally to build the dep tree and
      # pass all three allowlisted module suites under Miri. Bump
      # deliberately once futuredsp releases a fix.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          components: miri

      - uses: Swatinem/rust-cache@v2

      # Allowlist of modules that don't touch FFI / mmap / syscalls.
      # Miri refuses to interpret FFI calls, so the native_sdk / file_source
      # paths are intentionally excluded.
      - name: cargo miri test (allowlisted modules)
        run: |
          cargo miri test --lib decompression
          cargo miri test --lib http_streaming
          cargo miri test --lib utils

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      # Runs all cargo-deny checks (advisories, licenses, bans, sources)
      # based on deny.toml configuration.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  hack:
    name: cargo-hack (feature permutations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: cargo hack
        run: cargo hack check --each-feature --no-dev-deps

  machete:
    name: cargo-machete (unused dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: cargo machete
        run: cargo machete

  # The Python bindings and the SoapySDR C++ plugin previously compiled
  # for the first time in release.yml — at tag time. These jobs make
  # them PR-gated. Mirrored in scripts/ci-local.sh (python/soapy steps).
  python:
    name: Python bindings (maturin build + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and install wheel
        run: |
          python -m pip install maturin pytest numpy pyarrow
          maturin build --release --manifest-path python-aaronia/Cargo.toml --out dist
          python -m pip install dist/*.whl

      - name: pytest
        run: python -m pytest python-aaronia/test_basic.py -q

  soapy:
    # macOS as well as Linux: the two toolchains link a dlopen'd module
    # differently, and a macOS-only link defect shipped through several
    # releases because nothing built the plugin on a Mac before the
    # release job did.
    name: SoapySDR plugin (cmake build + load check)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - name: Install SoapySDR (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsoapysdr-dev soapysdr-tools

      - name: Install SoapySDR (macOS)
        if: runner.os == 'macOS'
        run: brew install soapysdr

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build plugin (drives cargo internally)
        run: |
          cmake -S soapy-aaronia -B soapy-aaronia/build -DCMAKE_BUILD_TYPE=Release
          cmake --build soapy-aaronia/build

      # --check reports a missing driver on stdout; check the text, not
      # just the exit status.
      - name: Module load check
        run: |
          SOAPY_SDR_PLUGIN_PATH=$PWD/soapy-aaronia/build \
            SoapySDRUtil --check=aaronia | tee check.log
          grep -q "PRESENT" check.log
