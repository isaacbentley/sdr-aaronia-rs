name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Refuse to publish when the pushed tag disagrees with Cargo.toml —
  # otherwise tag vX publishes whatever version the manifest happens to
  # carry, across three registries.
  tag_version_guard:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: false
      - name: Compare tag and manifest versions
        run: |
          # Every manifest this release publishes from, not just the root.
          # python-aaronia carries its own version and ships to PyPI; when
          # only the root was checked, forgetting it would have shipped
          # PyPI 0.9.0 beside crates.io 0.10.0 with no gate firing.
          # pyproject.toml takes its version from Cargo.toml (dynamic), so
          # it needs no separate check.
          tag="${GITHUB_REF_NAME#v}"
          rc=0
          for manifest in Cargo.toml python-aaronia/Cargo.toml; do
            got=$(grep -m1 '^version' "$manifest" | sed 's/.*"\(.*\)"/\1/')
            if [ "$tag" != "$got" ]; then
              echo "tag v$tag != $manifest version $got" >&2
              rc=1
            fi
          done
          exit $rc

  # Real gate (no continue-on-error): a breaking API change must be caught
  # here, before it's published, not merely reported per-PR where it can
  # never actually block anything. Runs against the tagged commit, so it
  # compares the exact code about to ship against a known-good baseline.
  #
  # Compare against the previous reachable release, never an obsolete fixed
  # baseline. The tag commit itself is excluded from the lookup.
  semver_checks:
    name: cargo-semver-checks
    needs: tag_version_guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: false
          fetch-depth: 0

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-semver-checks

      # Every feature except `futuresdr` and `futuresdr-audio` (ci.yml's
      # STABLE_FEATURES).
      # semver-checks' default heuristic would enable `futuresdr` too, and
      # FutureSDR 0.10 builds only on nightly (E0554 on this stable
      # toolchain). Running this job on the pinned nightly instead does not
      # work while the baseline is v0.14.0 or older: it must build as well,
      # and its futuresdr 0.0.39 pulls futuredsp 0.0.8, whose nightly-only
      # `fadd_fast` path current nightlies reject (see ci.yml's Miri pin).
      # The FutureSDR block API is therefore the one surface not checked.
      - name: cargo semver-checks
        run: |
          baseline=$(git describe --tags --match 'v*' --abbrev=0 "$GITHUB_SHA^")
          # `tls` is new in 0.15.1: a baseline before it has no such feature,
          # so it is asked of the current revision only.
          tls=--features
          git show "$baseline:Cargo.toml" | grep -q '^tls *=' || tls=--current-features
          cargo semver-checks check-release --baseline-rev "$baseline" \
            --only-explicit-features --features http,file,ffi,seify,native-sdk "$tls" tls

  validate:
    name: Release CI
    needs: tag_version_guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: [semver_checks, validate]
    runs-on: ubuntu-latest
    # The registry token is the one long-lived credential this workflow
    # holds. Running the job in an environment lets the repository owner
    # put required reviewers and a tag rule on it, and scope the secret
    # to the environment instead of the repository — until then any
    # workflow run by anyone with write access can read it. Create the
    # `crates-io` environment under Settings -> Environments and move
    # CARGO_REGISTRY_TOKEN into it; GitHub creates it unprotected on
    # first use otherwise.
    environment:
      name: crates-io
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # `--locked` refuses to publish if Cargo.lock is out of date with
      # Cargo.toml, so a release can't accidentally ship against
      # dependency versions that were never actually tested by the gates
      # above.
      # Idempotent: a release re-run (transient runner failures happen)
      # must not go red because the crate version already landed on the
      # first attempt.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          # crates.io's API rejects requests without a User-Agent —
          # without it this probe silently missed and the re-run died
          # on "version already exists".
          if curl -fsS -A "sdr-aaronia-rs-release-ci (github actions)" \
               "https://crates.io/api/v1/crates/sdr-aaronia-rs/${version}" \
               | grep -q "\"num\":\"${version}\""; then
            echo "sdr-aaronia-rs ${version} already on crates.io — skipping publish"
          else
            cargo publish --locked
          fi

  build-python:
    name: Build Python wheels
    needs: [semver_checks, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # python-aaronia builds abi3 wheels (pyo3 abi3-py39), so one
      # wheel per OS/arch covers CPython >= 3.9; the interpreter above
      # is only the build host.
      - name: Build wheels (Linux / Windows)
        if: runner.os != 'macOS'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          # --locked: the wheel ships with exactly the dependency
          # versions in Cargo.lock, the ones the gates above tested.
          args: --release --locked --features native-sdk --manifest-path python-aaronia/Cargo.toml --out dist

      - name: Build wheels (macOS)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --manifest-path python-aaronia/Cargo.toml --out dist

      # Source distribution: pip's fallback for platforms/pythons the
      # wheel matrix doesn't cover.
      - name: Build sdist
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --manifest-path python-aaronia/Cargo.toml --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-wheels-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  build-soapy:
    name: Build SoapySDR Plugin
    needs: [semver_checks, validate]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - name: Install SoapySDR (Linux)
        if: runner.os == 'Linux'
        # soapysdr-tools provides SoapySDRUtil, which the packaging step
        # uses to confirm the stripped module still loads. libsoapysdr-dev
        # alone does not pull it in.
        run: sudo apt-get install -y libsoapysdr-dev soapysdr-tools

      - name: Install SoapySDR (macOS)
        if: runner.os == 'macOS'
        run: brew install soapysdr

      - name: Install SoapySDR (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install soapysdr:x64-windows

      # Hygiene, not the fix: the module's link line no longer asks for
      # a flat namespace, so the dangling-bind defect that broke every
      # published macOS module cannot recur. Older linkers hit it and
      # newer ones did not, so build with the newest Xcode the image
      # ships rather than whatever xcode-select happens to point at.
      - name: Select newest Xcode (macOS)
        if: runner.os == 'macOS'
        run: |
          newest=$(find /Applications -maxdepth 1 -name 'Xcode*.app' 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version
          ld -v 2>&1 | head -2 || true

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable

      # No rust-cache here, nor in build-python: these jobs produce the
      # binaries that are published, and a restored `target/` is build
      # output from an earlier run that nothing in this one verifies.
      # A clean build costs a few minutes per release.

      # CMake drives the cargo build itself (static lib, linked into
      # the module — the shipped artifact has no Rust dylib dependency).
      # `cmake --build` works with both Makefile and Visual Studio
      # multi-config generators; the old `make` invocation could not
      # build on Windows at all, and VS puts outputs under Release/.
      - name: Build Soapy Plugin
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -S soapy-aaronia -B soapy-aaronia/build -DCMAKE_BUILD_TYPE=Release \
              -DAARONIA_NATIVE_SDK=ON \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          elif [ "$RUNNER_OS" == "Linux" ]; then
            cmake -S soapy-aaronia -B soapy-aaronia/build -DCMAKE_BUILD_TYPE=Release \
              -DAARONIA_NATIVE_SDK=ON \
              -DCMAKE_VERBOSE_MAKEFILE=ON
          else
            cmake -S soapy-aaronia -B soapy-aaronia/build -DCMAKE_BUILD_TYPE=Release \
              -DAARONIA_NATIVE_SDK=OFF \
              -DCMAKE_VERBOSE_MAKEFILE=ON
          fi
          cmake --build soapy-aaronia/build --config Release

      # CMake MODULE targets are lib<name>.so on both Linux and macOS
      # (SoapySDR modules on macOS are .so, not .dylib).
      # One self-describing archive per platform. A bare
      # `libaaroniaSupport.so` on a release page says nothing about its
      # version, OS, architecture, or that it is a SoapySDR plugin, and
      # gives the user no clue where to put it. Each archive therefore
      # carries the module, install instructions and the licence.
      # Per-platform rather than one combined archive: the Linux module
      # alone is several MB, and a Windows user should not download all
      # three to get one.
      - name: Package Plugin
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$RUNNER_OS" in
            Linux)   os=linux;   arch=x86_64 ;;
            Windows) os=windows; arch=x86_64 ;;
            macOS)   os=macos;   arch="$(uname -m)" ;;
            *) echo "unknown runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          stage="SoapyAaronia-${version}-${os}-${arch}"
          mkdir -p "soapy-aaronia/dist/$stage"

          if [ "$RUNNER_OS" == "Windows" ]; then
            cp soapy-aaronia/build/Release/aaroniaSupport.dll "soapy-aaronia/dist/$stage/"
          else
            cp soapy-aaronia/build/libaaroniaSupport.so "soapy-aaronia/dist/$stage/"
          fi
          # The Linux module shipped ~19 MB against ~5 MB for Windows,
          # the difference being debug symbols. --strip-debug drops those
          # and keeps every symbol the loader needs; a full strip is not
          # worth the risk on a dlopen'd module. macOS is left alone: it
          # is already the same size as the Windows build.
          if [ "$RUNNER_OS" == "Linux" ]; then
            before=$(stat -c%s "soapy-aaronia/dist/$stage/libaaroniaSupport.so")
            strip --strip-debug "soapy-aaronia/dist/$stage/libaaroniaSupport.so"
            after=$(stat -c%s "soapy-aaronia/dist/$stage/libaaroniaSupport.so")
            echo "stripped debug symbols: $before -> $after bytes"
          fi

          # Prove the packaged module actually loads, on every platform.
          # This ran on Linux only, and macOS shipped a module that no
          # Mac could dlopen for several releases as a result: the
          # linker left a flat-namespace bind to a symbol it had
          # localised into the same image. The check is worth nothing on
          # the platforms it skips.
          if [ "$RUNNER_OS" == "Windows" ]; then
            util=$(find "$VCPKG_INSTALLATION_ROOT" -name SoapySDRUtil.exe \
                     -print -quit 2>/dev/null || true)
            if [ -n "$util" ]; then
              # The tool needs the vcpkg DLLs beside it on PATH.
              PATH="$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin:$PATH" \
                SOAPY_SDR_PLUGIN_PATH="$PWD/soapy-aaronia/dist/$stage" \
                "$util" --check=aaronia | tee check.log
              grep -q "PRESENT" check.log
            else
              # vcpkg's soapysdr port ships no SoapySDRUtil, so load the
              # module directly. That still catches what breaks a
              # packaged module — a DLL whose dependencies do not
              # resolve on a machine that is not the build machine.
              dll=$(cygpath -w "$PWD/soapy-aaronia/dist/$stage/aaroniaSupport.dll")
              bin=$(cygpath -w "$VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin")
              powershell -NoProfile -Command "
                \$ErrorActionPreference = 'Stop'
                \$env:PATH = '$bin;' + \$env:PATH
                Add-Type -Namespace Native -Name Lib -MemberDefinition '
                  [DllImport(\"kernel32\", SetLastError=true)]
                  public static extern IntPtr LoadLibrary(string path);'
                \$h = [Native.Lib]::LoadLibrary('$dll')
                if (\$h -eq [IntPtr]::Zero) {
                  \$e = [Runtime.InteropServices.Marshal]::GetLastWin32Error()
                  throw \"LoadLibrary failed (\$e): \$((New-Object ComponentModel.Win32Exception \$e).Message)\"
                }
                Write-Host 'module loaded'"
            fi
          else
            # --check reports a missing driver on stdout and still exits
            # 0, so the exit status alone would pass on a module that
            # failed to load.
            SOAPY_SDR_PLUGIN_PATH="$PWD/soapy-aaronia/dist/$stage" \
              SoapySDRUtil --check=aaronia | tee check.log
            grep -q "PRESENT" check.log
          fi

          cp LICENSE "soapy-aaronia/dist/$stage/" 2>/dev/null || true
          cp soapy-aaronia/README.md "soapy-aaronia/dist/$stage/INSTALL.md"
          # One-command install: find SoapySDR's module directory, copy the
          # plugin in, clear the macOS quarantine flag.
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp soapy-aaronia/packaging/install.ps1 "soapy-aaronia/dist/$stage/"
          else
            cp soapy-aaronia/packaging/install.sh "soapy-aaronia/dist/$stage/"
            chmod +x "soapy-aaronia/dist/$stage/install.sh"
          fi

          cd soapy-aaronia/dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a -tzip "${stage}.zip" "$stage" >/dev/null
          elif [ "$RUNNER_OS" == "macOS" ]; then
            hdiutil create -volname "${stage}" -srcfolder "$stage" -ov -format UDZO "${stage}.dmg"
          else
            tar czf "${stage}.tar.gz" "$stage"
          fi
          ls -lh "$stage".*

      - name: Upload Plugin
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soapy-plugin-${{ matrix.os }}
          path: |
            soapy-aaronia/dist/*.zip
            soapy-aaronia/dist/*.dmg
            soapy-aaronia/dist/*.tar.gz

  github-release:
    name: GitHub Release
    needs: [semver_checks, publish, build-python, build-soapy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build-provenance attestations: an OIDC token to sign with, and
      # the right to store the result against this repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      # The release body is the hand-written CHANGELOG entry for this
      # tag — what actually changed and why — rather than only the
      # auto-generated commit list (which still gets appended below).
      - name: Extract changelog section for this tag
        run: |
          tag="${GITHUB_REF_NAME}"
          # Read the tag through ENVIRON rather than `awk -v`: -v expands
          # backslash escapes, so a tag containing one would be silently
          # mangled before the comparison.
          TAG="$tag" BARE="${tag#v}" awk '
            BEGIN { a = "## [" ENVIRON["TAG"] "]"; b = "## [" ENVIRON["BARE"] "]" }
            index($0, a) == 1 || index($0, b) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Never fail the release over a missing section; say so instead.
          if [ ! -s release-notes.md ]; then
            printf 'No CHANGELOG entry found for %s.\n' "$tag" > release-notes.md
          fi
          echo "--- release body ---"
          cat release-notes.md

      # Render the Homebrew formula against this release's real archives,
      # so updating the tap is a copy rather than a hand-hashing exercise
      # that silently ships a wrong checksum.
      - name: Render Homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p formula
          mac="artifacts/SoapyAaronia-${version}-macos-arm64.dmg"
          linux="artifacts/SoapyAaronia-${version}-linux-x86_64.tar.gz"
          for f in "$mac" "$linux"; do
            if [ ! -f "$f" ]; then
              echo "missing plugin archive: $f" >&2
              exit 1
            fi
          done
          sed -e "s/^  version \".*\"/  version \"${version}\"/" \
              -e "s/REPLACE_WITH_SHA256_OF_MACOS_ARM64_ARCHIVE/$(sha256sum "$mac" | cut -d' ' -f1)/" \
              -e "s/REPLACE_WITH_SHA256_OF_LINUX_X86_64_ARCHIVE/$(sha256sum "$linux" | cut -d' ' -f1)/" \
              packaging/homebrew/soapy-aaronia.rb > formula/soapy-aaronia.rb
          echo "--- rendered formula ---"
          cat formula/soapy-aaronia.rb

      # A workflow artifact, not a release asset. Homebrew 4 and later
      # cannot install from a formula URL, so on the release page this
      # is a file no user can do anything with, sitting among ones they
      # can. Its only reader is whoever updates the tap, and they can
      # take it from here.
      - name: Upload Homebrew formula
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-formula
          path: formula/soapy-aaronia.rb

      # One checksum file over everything on the release page, so a
      # download can be checked without the GitHub CLI.
      - name: Write SHA256SUMS
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          files=(*.whl *.dmg *.tar.gz *.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release assets to checksum" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      # Signed provenance for the same files: `gh attestation verify
      # <file> --repo <owner>/<repo>` proves an asset was built by this
      # workflow from this repository at this tag, which a checksum file
      # sitting beside the asset cannot.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # *.tar.gz covers both the Python sdist and the Linux plugin
          # archive; macOS ships as *.dmg and Windows as *.zip.
          files: |
            artifacts/*.whl
            artifacts/*.dmg
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          body_path: release-notes.md
          generate_release_notes: true

  pypi-publish:
    name: Publish Python wheels to PyPI
    needs: [semver_checks, publish, build-python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # A re-run of a partially failed release must not go red on
          # the files that already made it to PyPI.
          skip-existing: true
