name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Real gate (no continue-on-error): a breaking API change must be caught
  # here, before it's published, not merely reported per-PR where it can
  # never actually block anything. Runs against the tagged commit, so it
  # compares the exact code about to ship against the last crates.io release.
  semver_checks:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: cargo semver-checks
        run: cargo semver-checks check-release

  publish:
    name: Publish to crates.io
    needs: semver_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@stable

      # `--locked` refuses to publish if Cargo.lock is out of date with
      # Cargo.toml, so a release can't accidentally ship against
      # dependency versions that were never actually tested by the gates
      # above.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
