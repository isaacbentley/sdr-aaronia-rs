name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Refuse to publish when the pushed tag disagrees with Cargo.toml —
  # otherwise tag vX publishes whatever version the manifest happens to
  # carry, across three registries.
  tag_version_guard:
    name: Tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Compare tag and manifest versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [ "$tag" != "$crate" ]; then
            echo "tag v$tag != Cargo.toml version $crate" >&2
            exit 1
          fi

  # Real gate (no continue-on-error): a breaking API change must be caught
  # here, before it's published, not merely reported per-PR where it can
  # never actually block anything. Runs against the tagged commit, so it
  # compares the exact code about to ship against a known-good baseline.
  #
  # Pinned to v0.2.4 rather than the default (latest crates.io release)
  # because 0.2.6 and 0.2.7, as published, fail to build rustdoc under
  # --all-features (missing BufferReader/CpuBufferReader imports and a
  # Send impl in sdk_sink.rs, only fixed post-release) -- cargo-semver-checks
  # can't diff against a baseline it can't compile. v0.2.4 predates
  # SdkSinkBlock/the futuresdr 0.0.39 migration and builds cleanly.
  semver_checks:
    name: cargo-semver-checks
    needs: tag_version_guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: cargo semver-checks
        run: cargo semver-checks check-release --baseline-rev v0.2.4

  publish:
    name: Publish to crates.io
    needs: semver_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        uses: ./.github/actions/linux-build-deps

      - uses: dtolnay/rust-toolchain@stable

      # `--locked` refuses to publish if Cargo.lock is out of date with
      # Cargo.toml, so a release can't accidentally ship against
      # dependency versions that were never actually tested by the gates
      # above.
      # Idempotent: a release re-run (transient runner failures happen)
      # must not go red because the crate version already landed on the
      # first attempt.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          # crates.io's API rejects requests without a User-Agent —
          # without it this probe silently missed and the re-run died
          # on "version already exists".
          if curl -fsS -A "sdr-aaronia-rs-release-ci (github actions)" \
               "https://crates.io/api/v1/crates/sdr-aaronia-rs/${version}" \
               | grep -q "\"num\":\"${version}\""; then
            echo "sdr-aaronia-rs ${version} already on crates.io — skipping publish"
          else
            cargo publish --locked
          fi

  build-python:
    name: Build Python wheels
    needs: semver_checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # python-aaronia builds abi3 wheels (pyo3 abi3-py39), so one
      # wheel per OS/arch covers CPython >= 3.9; the interpreter above
      # is only the build host.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path python-aaronia/Cargo.toml --out dist

      # Source distribution: pip's fallback for platforms/pythons the
      # wheel matrix doesn't cover.
      - name: Build sdist
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path python-aaronia/Cargo.toml --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  build-soapy:
    name: Build SoapySDR Plugin
    needs: semver_checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-deps

      - name: Install SoapySDR (Linux)
        if: runner.os == 'Linux'
        # soapysdr-tools provides SoapySDRUtil, which the packaging step
        # uses to confirm the stripped module still loads. libsoapysdr-dev
        # alone does not pull it in.
        run: sudo apt-get install -y libsoapysdr-dev soapysdr-tools

      - name: Install SoapySDR (macOS)
        if: runner.os == 'macOS'
        run: brew install soapysdr

      - name: Install SoapySDR (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install soapysdr:x64-windows

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # CMake drives the cargo build itself (static lib, linked into
      # the module — the shipped artifact has no Rust dylib dependency).
      # `cmake --build` works with both Makefile and Visual Studio
      # multi-config generators; the old `make` invocation could not
      # build on Windows at all, and VS puts outputs under Release/.
      - name: Build Soapy Plugin
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -S soapy-aaronia -B soapy-aaronia/build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -S soapy-aaronia -B soapy-aaronia/build -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build soapy-aaronia/build --config Release

      # CMake MODULE targets are lib<name>.so on both Linux and macOS
      # (SoapySDR modules on macOS are .so, not .dylib).
      # One self-describing archive per platform. A bare
      # `libaaroniaSupport.so` on a release page says nothing about its
      # version, OS, architecture, or that it is a SoapySDR plugin, and
      # gives the user no clue where to put it. Each archive therefore
      # carries the module, install instructions and the licence.
      # Per-platform rather than one combined archive: the Linux module
      # alone is several MB, and a Windows user should not download all
      # three to get one.
      - name: Package Plugin
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$RUNNER_OS" in
            Linux)   os=linux;   arch=x86_64 ;;
            Windows) os=windows; arch=x86_64 ;;
            macOS)   os=macos;   arch="$(uname -m)" ;;
            *) echo "unknown runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac
          stage="SoapyAaronia-${version}-${os}-${arch}"
          mkdir -p "soapy-aaronia/dist/$stage"

          if [ "$RUNNER_OS" == "Windows" ]; then
            cp soapy-aaronia/build/Release/aaroniaSupport.dll "soapy-aaronia/dist/$stage/"
          else
            cp soapy-aaronia/build/libaaroniaSupport.so "soapy-aaronia/dist/$stage/"
          fi
          # The Linux module shipped ~19 MB against ~5 MB for Windows,
          # the difference being debug symbols. --strip-debug drops those
          # and keeps every symbol the loader needs; a full strip is not
          # worth the risk on a dlopen'd module. macOS is left alone: it
          # is already the same size as the Windows build.
          if [ "$RUNNER_OS" == "Linux" ]; then
            before=$(stat -c%s "soapy-aaronia/dist/$stage/libaaroniaSupport.so")
            strip --strip-debug "soapy-aaronia/dist/$stage/libaaroniaSupport.so"
            after=$(stat -c%s "soapy-aaronia/dist/$stage/libaaroniaSupport.so")
            echo "stripped debug symbols: $before -> $after bytes"
            # A module that no longer loads is worse than a large one.
            SOAPY_SDR_PLUGIN_PATH="$PWD/soapy-aaronia/dist/$stage" \
              SoapySDRUtil --check=aaronia
          fi

          cp LICENSE "soapy-aaronia/dist/$stage/" 2>/dev/null || true
          cp soapy-aaronia/README.md "soapy-aaronia/dist/$stage/INSTALL.md"
          # One-command install: find SoapySDR's module directory, copy the
          # plugin in, clear the macOS quarantine flag.
          if [ "$RUNNER_OS" == "Windows" ]; then
            cp soapy-aaronia/packaging/install.ps1 "soapy-aaronia/dist/$stage/"
          else
            cp soapy-aaronia/packaging/install.sh "soapy-aaronia/dist/$stage/"
            chmod +x "soapy-aaronia/dist/$stage/install.sh"
          fi

          cd soapy-aaronia/dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a -tzip "${stage}.zip" "$stage" >/dev/null
          else
            tar czf "${stage}.tar.gz" "$stage"
          fi
          ls -lh "$stage".*

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: soapy-plugin-${{ matrix.os }}
          path: |
            soapy-aaronia/dist/*.zip
            soapy-aaronia/dist/*.tar.gz

  github-release:
    name: GitHub Release
    needs: [semver_checks, publish, build-python, build-soapy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The release body is the hand-written CHANGELOG entry for this
      # tag — what actually changed and why — rather than only the
      # auto-generated commit list (which still gets appended below).
      - name: Extract changelog section for this tag
        run: |
          tag="${GITHUB_REF_NAME}"
          # Read the tag through ENVIRON rather than `awk -v`: -v expands
          # backslash escapes, so a tag containing one would be silently
          # mangled before the comparison.
          TAG="$tag" BARE="${tag#v}" awk '
            BEGIN { a = "## [" ENVIRON["TAG"] "]"; b = "## [" ENVIRON["BARE"] "]" }
            index($0, a) == 1 || index($0, b) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Never fail the release over a missing section; say so instead.
          if [ ! -s release-notes.md ]; then
            printf 'No CHANGELOG entry found for %s.\n' "$tag" > release-notes.md
          fi
          echo "--- release body ---"
          cat release-notes.md

      # Render the Homebrew formula against this release's real archives,
      # so updating the tap is a copy rather than a hand-hashing exercise
      # that silently ships a wrong checksum.
      - name: Render Homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mac="artifacts/SoapyAaronia-${version}-macos-arm64.tar.gz"
          linux="artifacts/SoapyAaronia-${version}-linux-x86_64.tar.gz"
          for f in "$mac" "$linux"; do
            if [ ! -f "$f" ]; then
              echo "missing plugin archive: $f" >&2
              exit 1
            fi
          done
          sed -e "s/^  version \".*\"/  version \"${version}\"/" \
              -e "s/REPLACE_WITH_SHA256_OF_MACOS_ARM64_ARCHIVE/$(sha256sum "$mac" | cut -d' ' -f1)/" \
              -e "s/REPLACE_WITH_SHA256_OF_LINUX_X86_64_ARCHIVE/$(sha256sum "$linux" | cut -d' ' -f1)/" \
              packaging/homebrew/soapy-aaronia.rb > artifacts/soapy-aaronia.rb
          echo "--- rendered formula ---"
          cat artifacts/soapy-aaronia.rb

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # *.tar.gz covers both the Python sdist and the Unix plugin
          # archives; the two never collide because the plugin archives
          # are named SoapyAaronia-<version>-<os>-<arch>.
          files: |
            artifacts/*.whl
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/soapy-aaronia.rb
          body_path: release-notes.md
          generate_release_notes: true

  pypi-publish:
    name: Publish Python wheels to PyPI
    needs: [semver_checks, publish, build-python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run of a partially failed release must not go red on
          # the files that already made it to PyPI.
          skip-existing: true
