name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuhd-dev uhd-host cmake pkg-config libasound2-dev libiio-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Tests
        run: cargo test --all-features

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
