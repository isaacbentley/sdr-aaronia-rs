[package]
name = "python-aaronia"
version = "0.7.0"
edition = "2024"
description = "Python bindings for sdr-aaronia-rs (Aaronia SPECTRAN V6 SDR source)"
license = "GPL-3.0-or-later"
repository = "https://github.com/isaacbentley/sdr-aaronia-rs"
# Distributed as Python wheels via maturin, not as a crates.io crate.
publish = false

[lib]
name = "aaronia"
crate-type = ["cdylib"]

[dependencies]
sdr-aaronia-rs = { path = "../" }
# abi3-py39: one wheel per OS/arch covers CPython 3.9+ instead of the
# single cp311 wheel the pinned-interpreter build produced.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
numpy = "0.29"
arrow = { version = "59.2", features = ["pyarrow"] }
num-complex = "0.4"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "macros"] }
pyo3-log = "0.13"
